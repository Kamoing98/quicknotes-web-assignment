<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Your Personal Note-Taking App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>📝 QuickNotes</h1>
      <p class="tagline">Capture your thoughts, stay organized.</p>
    </header>

    <main>
      <section id="add-note-section">
        <h2>Add a Note</h2>
        <form id="note-form">
          <label for="note-input">Your note:</label>
          <input
            type="text"
            id="note-input"
            placeholder="Type your note here..."
            maxlength="200"
          />
          <label for="note-category">Category:</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
          <button type="submit" id="add-btn">Add Note</button>
        </form>
        <p id="error-message"></p>
      </section>

      <section id="notes-section">
        <h2>Your Notes</h2>
        <input
          type="text"
          id="search-input"
          placeholder="Search notes..."
        />
        <p id="note-count"></p>
        <ul id="notes-list"></ul>
        <button type="button" id="clear-all-btn">Clear All</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built with ❤️ for learning.</p>
    </footer>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
